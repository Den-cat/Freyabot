name: Content Check Bot

on:
  schedule:
    # Окно 1 (11:15 - 12:15 UTC+2) -> UTC: 09:15 - 10:15
    # Запуски: 09:15, 20, 25, 30, 35, 40, 45, 50, 55 и 10:00, 05, 10, 15
    - cron: '15,20,25,30,35,40,45,50,55 9 * * *'
    - cron: '0,5,10,15 10 * * *'
    
    # Окно 2 (19:15 - 20:15 UTC+2) -> UTC: 17:15 - 18:15
    # Запуски: 17:15, 20, 25, 30, 35, 40, 45, 50, 55 и 18:00, 05, 10, 15
    - cron: '15,20,25,30,35,40,45,50,55 17 * * *'
    - cron: '0,5,10,15 18 * * *'
    
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests feedparser beautifulsoup4 lxml
      - name: Execute Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: python bot.py
      - name: Commit and Push state change
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update monitor state [skip ci]" || echo "No changes"
          git push
