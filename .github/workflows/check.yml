name: Content Check Bot

on:
  # Автоматическое расписание отключено. 
  # Чтобы включить обратно, раскомментируйте строки ниже.
  # schedule:
  #   - cron: '15,20,25,30,35,40,45,50,55 9 * * *'
  #   - cron: '0,5,10,15 10 * * *'
  #   - cron: '15,20,25,30,35,40,45,50,55 17 * * *'
  #   - cron: '0,5,10,15 18 * * *'
    
  workflow_dispatch: # Позволяет запускать бота вручную из вкладки Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests feedparser beautifulsoup4 lxml
      - name: Execute Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: python bot.py
      - name: Commit and Push state change
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update monitor state [skip ci]" || echo "No changes"
          git push
