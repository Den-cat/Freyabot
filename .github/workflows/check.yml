name: Content Check Bot

on:
  schedule:
    # GitHub использует время UTC (Хельсинки/Киев UTC+2)
    # Окно 1: 11:00 - 13:00 Local -> 09:00 - 10:59 UTC
    - cron: '*/5 9,10 * * *'
    # Окно 2: 19:00 - 20:00 Local -> 17:00 - 17:59 UTC
    - cron: '*/5 17 * * *'
  workflow_dispatch: # Ручной запуск доступен всегда

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests feedparser beautifulsoup4 lxml

      - name: Execute Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: python bot.py

      - name: Commit and Push state change
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update monitor state [skip ci]" || echo "No changes"
          git push
